name: Go Build/Test

on:
  workflow_call:

jobs:
  Go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # 固定版本，避免 `latest`（v2）无法加载本项目 v1 格式的 .golangci.yml（CI 报 exit code 3）
          version: v1.64.8

          # v6 action 默认会跑 `golangci-lint config verify`，其 JSONSchema 对 v1 配置误报
          # （`run.skip-dirs`/`exclusions` 被 additionalProperties:false 拒绝，属于已知误报）。
          # 关闭该校验，.golangci.yml 仍由 `golangci-lint run` 正常解析。
          verify: false

          # Optional: working directory, useful for monorepos
          working-directory: backend
          args: --timeout=6m

      - name: Build API
        run: task go:build

      - name: Test
        run: task go:coverage
