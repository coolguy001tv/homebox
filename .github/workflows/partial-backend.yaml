name: Go Build/Test

on:
  workflow_call:

jobs:
  Go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod 要求 go 1.25.0，而 golangci-lint 用 GOTOOLCHAIN=local（不会自动升级工具链），
          # 若工具链低于 1.25 会报 "go.mod requires go >= 1.25.0 (running go 1.23; GOTOOLCHAIN=local)"。
          go-version: "1.25"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # 固定版本，避免 `latest`（v2）无法加载本项目 v1 格式的 .golangci.yml（CI 报 exit code 3）
          version: v1.64.8

          # 官方 v1.64.8 二进制由 Go 1.24 编译，与 go1.25 工具链/go.mod 1.25.0 不兼容：
          # go/packages 加载时内存失控 OOM（exit 137，Docker 已复现）。
          # install-mode: goinstall 让 action 用 CI 工具链 go1.25 从源码编译 golangci，
          # 生成 go1.25-built 二进制，与项目匹配（Docker 实证 golangci run EXIT=0）。
          install-mode: goinstall

          # v6 action 默认会跑 `golangci-lint config verify`，其 JSONSchema 对 v1 配置误报
          # （`run.skip-dirs`/`exclusions` 被 additionalProperties:false 拒绝，属于已知误报）。
          # 关闭该校验，.golangci.yml 仍由 `golangci-lint run` 正常解析。
          verify: false

          # Optional: working directory, useful for monorepos
          working-directory: backend
          args: --timeout=6m

      - name: Build API
        run: task go:build

      - name: Test
        run: task go:coverage
