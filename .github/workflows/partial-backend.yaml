name: Go Build/Test

on:
  workflow_call:

jobs:
  Go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod 要求 go 1.25.0，而 golangci-lint 用 GOTOOLCHAIN=local（不会自动升级工具链），
          # 若工具链低于 1.25 会报 "go.mod requires go >= 1.25.0 (running go 1.23; GOTOOLCHAIN=local)"。
          go-version: "1.25"
          # go.sum 在 backend/ 子目录，不指定的话 setup-go 在仓库根找不到缓存依赖
          cache-dependency-path: backend/go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2.12.2（go1.26 编译），原生支持 go.mod 1.25.0 模块：
          # 不再需要 install-mode: goinstall 从源码编译，官方二进制直接可用；
          # 也不再触发 v1.64.8 官方二进制（go1.24 编译）的 OOM / 版本不匹配问题。
          version: v2.12.2

          # v2 配置带 `version: "2"`，JSONSchema 校验正常，无需再关 verify
          # （v1 配置曾因 run.skip-dirs 被误报而设 verify: false）
          verify: true

          # Optional: working directory, useful for monorepos
          working-directory: backend
          args: --timeout=6m

      - name: Build API
        run: task go:build

      - name: Test
        run: task go:coverage
