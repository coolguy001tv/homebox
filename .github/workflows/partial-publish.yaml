name: Publish Docker

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release:
        required: false
        type: boolean
        default: false

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  publish:
    name: "Publish Homebox"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        # 注意：v4 移除了 `install` 输入——装 buildx 插件到 docker CLI 已是默认行为
        # （非 standalone 时自动 installPlugin），后续 `docker buildx build` 照常可用

      - name: login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build nightly image
        if: ${{ inputs.release == false }}
        # 三平台 buildx 推送偶发卡死（v0.1.19 曾卡近 6h 被 GH Actions 超时取消），
        # 显式加 30 分钟超时保护，避免长时间占满 job
        timeout-minutes: 30
        run: |
          docker buildx build --push --no-cache \
            --tag=hellocoolguy/homebox:${{ inputs.tag }} \
            --build-arg=COMMIT=$(git rev-parse HEAD) \
            --build-arg=BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --platform=linux/amd64,linux/arm64,linux/arm/v7 .

      - name: build release image
        if: ${{ inputs.release == true }}
        timeout-minutes: 30
        run: |
          docker buildx build --push --no-cache \
            --tag hellocoolguy/homebox:latest \
            --tag hellocoolguy/homebox:${{ inputs.tag }} \
            --build-arg VERSION=${{ inputs.tag }} \
            --build-arg COMMIT=$(git rev-parse HEAD) \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --platform linux/amd64,linux/arm64,linux/arm/v7 .
