version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testifylint
    - unconvert
    - unused
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/util
              desc: |
                Deprecated: As of Go 1.16, the same functionality is now provided by
                package io or package os, and those implementations should be
                preferred in new code. See the specific function documentation for
                details.
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 5
      min-occurrences: 5
      # v2 新版 goconst 会把测试 fixture 里的领域字面量（如 CSV 表头 HB.*）也算进去。
      # 测试里用真实字面量是设计使然，开启后与 v1.64.8 的行为一致（非测试代码里
      # HB.location 仅出现 1 次，达不到 min-occurrences=5）。
      ignore-tests: true
    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - captLocal
        - exitAfterDefer
    revive:
      confidence: 3
      severity: warning
    tagalign:
      order:
        - json
        - schema
        - yaml
        - yml
        - toml
        - validate
    testifylint:
      enable-all: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # 迁移前的 run.skip-dirs 对应项：ent 生成代码整目录排除（含 ent/schema，
      # 项目内代码规范由 review 保证，lint 不碰 ent，与 v1 行为一致）
      - internal/data/ent.*
issues:
  fix: true
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
