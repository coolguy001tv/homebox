run:
  timeout: 10m
  # golangci-lint 官方 v1.64.8 二进制由 Go 1.24 编译，而 go.mod 目标是 1.25.0，
  # 会导致 "build go version lower than targeted" 报错 (exit 3)。
  # 这里显式指定分析用的 Go 版本为 1.24，绕过 go.mod 目标版本检查。
  go: "1.24.0"
  skip-dirs:
    - internal/data/ent.*
linters-settings:
  goconst:
    min-len: 5
    min-occurrences: 5
  exhaustive:
    default-signifies-exhaustive: true
  revive:
    ignore-generated-header: false
    severity: warning
    confidence: 3
  depguard:
    rules:
      main:
        deny:
          - pkg: io/util
            desc: |
              Deprecated: As of Go 1.16, the same functionality is now provided by
              package io or package os, and those implementations should be
              preferred in new code. See the specific function documentation for
              details.
  gocritic:
    enabled-checks:
      - ruleguard
    disabled-checks:
      # 项目有意使用全大写缩写参数名（GID/ID/UID/AID），且 TestMain 的
      # os.Exit(m.Run()) 与 main 中的 log.Fatal 是标准退出模式，这两项检查误报居多
      - captLocal
      - exitAfterDefer
  testifylint:
    enable-all: true
  tagalign:
    order:
      - json
      - schema
      - yaml
      - yml
      - toml
      - validate
linters:
  disable-all: true
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - stylecheck
    - tagalign
    - testifylint
    - typecheck
    - typecheck
    - unconvert
    - unused
    - whitespace
    - zerologlint
    - sqlclosecheck
issues:
  exclude-use-default: false
  fix: true
